# HiveMemory 主配置文件
#
# 环境变量格式: HIVEMEMORY__<SECTION>__<FIELD> (双下划线分隔)
# 示例: HIVEMEMORY__PATCHOULI__PERCEPTION__ENGINE__IDLE_TIMEOUT_SECONDS=900

# ========== 系统配置 ==========
system:
  name: "HiveMemory"
  debug: true

# ========== 国际化配置 ==========
i18n:
  default_language: "zh"
  fallback_language: "en"
  supported_languages:
    - "zh"
    - "en"

# ========== 日志配置 ==========
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null
  console_output: true
  websocket_enabled: true
  websocket_namespaces:
    - "hivememory.patchouli.*"
    - "hivememory.engines.*"
    - "hivememory.infrastructure.system_bus"
  websocket_level: "INFO"
  websocket_buffer_size: 100
  websocket_max_rate: 200

# ========== RuntimeEvent 事件流配置 ==========
runtime_events:
  enabled: true
  buffer_size: 1000
  subscriber_queue_size: 100

# ========== 跨子系统共享配置 ==========
shared:
  llm:
    # gateway 和 librarian 通过 model_id 引用模型注册表（configs/models.yaml）。
    # model/api_key/api_base 由 ModelRegistry.resolve_for_llm_config() 在启动时填充，无需手动配置。
    # temperature/max_tokens 是组件专属调参，始终覆盖注册表模型的默认值。
    gateway:
      model_id: "deepseek-chat"  # 引用 models.yaml 中的模型 ID
      temperature: 0.0           # 网关用极低温，确保路由稳定
      max_tokens: 512

    librarian:
      model_id: "deepseek-chat"
      temperature: 0.3           # 记忆整理用低温，输出稳定
      max_tokens: 8192           # 需要处理较长上下文

  embedding:
    default:
      model_name: "Xenova/bge-m3"
      device: "cpu"
      cache_dir: "data/model_cache"
      batch_size: 32
      normalize_embeddings: true
      dimension: 1024

  # ========== 模型提供商凭证 ==========
  # 供模型注册表（configs/models.yaml）按 provider 补齐 api_key / api_base。
  # api_key 一律留空于此文件（本文件被 git 跟踪），由环境变量注入：
  #   HIVEMEMORY__PROVIDERS__<NAME>__API_KEY
  #   HIVEMEMORY__PROVIDERS__<NAME>__API_BASE
  # <NAME> 对应模型定义的 provider 字段（大小写不敏感），如 DEEPSEEK / OPENAI。
  providers:
    deepseek:
      api_key: null
      api_base: "https://api.deepseek.com"

# ========== Patchouli 子系统配置 ==========
memory_compiler:
  retrieval_context:
    strategy:
      type: "compact"
      max_memory_tokens: 2000
      index_max_summary_length: 100

# ========== System Gateway 配置 ==========
gateway:
  interceptor:
    enabled: true
    enable_system: true
    enable_chat: true
  analyzer:
    enabled: true

patchouli:
  storage:
    host: "127.0.0.1"
    port: 6333
    grpc_port: 6334
    prefer_grpc: true
    timeout: 60
    deployment: "external"
    data_dir: null
    binary_path: null
    startup_timeout_seconds: 30
    api_key: null  # 通过环境变量 HIVEMEMORY__PATCHOULI__STORAGE__API_KEY 设置
    collection_name: "hivememory_main"
    vector_dimension: 1024
    distance_metric: "Cosine"
    on_disk_payload: false

  perception:
    engine:
      enable: true
      idle_timeout_seconds: 900
      scan_interval_seconds: 30
      fold_token_threshold: 32768
      fold_retain_recent_blocks: 2
      max_resident_topics: 5
      relay:
        enable: true
        engine:
          type: "simple"

  generation:
    extractor:
      enabled: true
    deduplicator:
      enabled: true
      high_similarity_threshold: 0.95
      low_similarity_threshold: 0.75
      content_similarity_threshold: 0.9
      enable_vitality_tracking: true

  retrieval:
    retriever:
      type: "hybrid"
      top_k: 5
      score_threshold: 0.0
      enable_parallel: true
      dense:
        type: "dense"
        enabled: true
        top_k: 50
        score_threshold: 0.0
        enable_time_decay: true
        time_decay_days: 30
        enable_confidence_boost: true
      sparse:
        type: "sparse"
        enabled: true
        top_k: 50
        score_threshold: 0.0
      fusion:
        type: "rrf"
        rrf_k: 60
        dense_weight: 1.0
        sparse_weight: 1.0
        final_top_k: 5
      reranker:
        enabled: true
        model_name: "BAAI/bge-reranker-base"
        device: "cpu"
        cache_dir: "data/model_cache"
        use_fp16: true
        batch_size: 32
        top_k: 20
        normalize_scores: true

  lifecycle:
    vitality_calculator:
      code_snippet_weight: 1.0
      fact_weight: 0.9
      url_resource_weight: 0.8
      reflection_weight: 0.7
      user_profile_weight: 0.6
      work_in_progress_weight: 0.5
      default_weight: 0.5
      max_access_boost: 20.0
      points_per_access: 2.0
      decay_lambda: 0.01
    reinforcement:
      enable_event_history: true
      event_history_limit: 10000
      hit_boost: 5.0
      citation_boost: 20.0
      positive_feedback_boost: 50.0
      negative_feedback_penalty: -50.0
      negative_confidence_multiplier: 0.5
    archiver:
      archive_dir: "data/archived"
      compression: true
    garbage_collector:
      low_watermark: 20.0
      batch_size: 10
    high_watermark: 80.0

  artifacts:
    enabled: true
    root_dir: ".hivememory/artifacts"
    max_inline_summary_chars: 500

# ========== Alice 子系统配置 ==========
alice:
  koakuma:
    enabled: true
    execution_timeout_seconds: 30
    workspace_path: "./workspace"
    mtp_prompt:
      enabled: true
      include_demo: true
      include_error_handling: true

  runtime:
    max_loop_iterations: 10

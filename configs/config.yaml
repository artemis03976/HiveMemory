# HiveMemory 主配置文件
#
# 环境变量格式: HIVEMEMORY__<SECTION>__<FIELD> (双下划线分隔)
# 示例: HIVEMEMORY__PATCHOULI__PERCEPTION__IDLE_TIMEOUT_SECONDS=900
# 各配置段拒绝未知键：键名写错或使用已删除的键时启动失败。

# ========== 系统配置 ==========
system:
  name: "HiveMemory"
  debug: true
  # server 自身经统一认证网关认证时使用的 principal 标识；
  # 必须与 configs/system_principals.yaml 中的接入登记一致。
  server_principal_id: "hivememory:http-server"

# ========== 国际化配置 ==========
i18n:
  default_language: "zh"

# ========== 日志配置 ==========
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null
  event_file_path: null
  console_output: true
  websocket_enabled: true
  websocket_namespaces:
    - "hivememory.patchouli.*"
    - "hivememory.engines.*"
    - "hivememory.infrastructure.system_bus"
  websocket_level: "INFO"
  websocket_buffer_size: 100
  websocket_max_rate: 200

# ========== RuntimeEvent 事件流配置 ==========
runtime_events:
  enabled: true
  buffer_size: 1000
  subscriber_queue_size: 100

# ========== 跨子系统共享配置 ==========
shared:
  embedding:
    default:
      model_name: "Xenova/bge-m3"
      cache_dir: "data/model_cache"
      # resident：加载后一直驻留；idle_unload：空闲超过 idle_timeout_seconds 秒后卸载，下次使用时重新加载
      residency: "idle_unload"
      idle_timeout_seconds: 1800

  # ========== 模型提供商凭证 ==========
  # 不写在本文件（本文件被 git 跟踪，出现非空 api_key 时加载失败）。模型注册表
  # （configs/models.yaml）按模型的 provider 字段向 Provider 注册表取 api_key / api_base：
  #   - .env 或环境变量：HIVEMEMORY__PROVIDERS__<NAME>__API_KEY / __API_BASE
  #   - Settings 的 Provider 设置：保存在 configs/providers.secrets.yaml（不提交）
  # <NAME> 对应模型定义的 provider 字段（大小写不敏感），如 DEEPSEEK / OPENAI。

# ========== Patchouli 子系统配置 ==========
memory_compiler:
  retrieval_context:
    strategy:
      type: "compact"
      max_memory_tokens: 2000
      index_max_summary_length: 100

# ========== System Gateway 配置 ==========
gateway:
  # 话题路由与查询分析使用的模型：model_id 引用 configs/models.yaml 中的模型（不写为默认模型），
  # 凭证由 Provider 凭证补齐；temperature/top_p/max_tokens 覆盖模型默认值，不写时沿用。
  # 这里写的是组件任务要求的值。整段写为 null 表示不使用 LLM。启动时解析，修改后重启生效。
  llm:
    model_id: "deepseek-chat"
    temperature: 0.0           # 网关用极低温，确保路由稳定
    max_tokens: 512

  context_preparation:
    session_turn_limit: 3
  interceptor:
    enabled: true
    enable_system: true
    enable_chat: true

patchouli:
  # Librarian 的模型（记忆提取、合并与话题折叠摘要），写法同 gateway.llm。
  llm:
    model_id: "deepseek-chat"
    temperature: 0.3           # 记忆整理用低温，输出稳定
    max_tokens: 32768          # 一次结算输出多条记忆，需要较大的输出上限

  storage:
    host: "127.0.0.1"
    port: 6333
    grpc_port: 6334
    prefer_grpc: true
    timeout: 60
    startup_timeout_seconds: 30
    api_key: null  # 通过环境变量 HIVEMEMORY__PATCHOULI__STORAGE__API_KEY 设置
    collection_name: "hivememory_main"
    vector_dimension: 1024
    distance_metric: "Cosine"
    on_disk_payload: false

  perception:
    idle_timeout_seconds: 3600
    engine:
      enable: true
      fold_token_threshold: 131072
      fold_retain_recent_blocks: 2
      max_resident_topics: 5
      relay:
        enable: true
        engine:
          type: "llm"

  generation:
    # 主动生成（WRITE/UPDATE）取话题最近几个 block 与 state_summary 作为材料
    active_recent_blocks: 5
    extractor:
      enabled: true
    deduplicator:
      enabled: true
      high_similarity_threshold: 0.95
      low_similarity_threshold: 0.75
      content_similarity_threshold: 0.9
    # 生成材料中单条外部工具结果的字符上限，其余内容原样保留；感知的 token
    # 统计使用同一个上限。
    transcript:
      max_result_chars: 800

  retrieval:
    # 请求未给出 top_k 时的结果条数；最终截取只在重排阶段之后进行一次
    default_top_k: 5
    retriever:
      type: "hybrid"
      top_k: 5
      enable_parallel: true
      dense:
        type: "dense"
        enabled: true
        top_k: 50
        # 分数阈值只作用于 Dense 召回（原始 cosine 相似度）；Sparse 与融合不设阈值
        score_threshold: 0.5
        enable_time_decay: true
        time_decay_days: 30
        enable_confidence_boost: true
      sparse:
        type: "sparse"
        enabled: true
        top_k: 50
      fusion:
        type: "rrf"
        rrf_k: 60
        dense_weight: 1.0
        sparse_weight: 1.0
    # 重排序是召回之后的独立阶段，适用于任意 retriever 类型
    reranker:
      enabled: true
      model_name: "BAAI/bge-reranker-base"
      cache_dir: "data/model_cache"
      batch_size: 32
      top_k: 20
      normalize_scores: true
      residency: "idle_unload"     # resident 或 idle_unload，含义同 shared.embedding.default
      idle_timeout_seconds: 600

  lifecycle:
    vitality_calculator:
      code_snippet_weight: 1.0
      fact_weight: 0.9
      url_resource_weight: 0.8
      reflection_weight: 0.7
      user_profile_weight: 0.6
      work_in_progress_weight: 0.5
      default_weight: 0.5
      decay_lambda: 0.01
    reinforcement:
      enable_event_history: true
      event_history_limit: 10000
      hit_boost: 5.0
      citation_boost: 20.0
      positive_feedback_boost: 50.0
      negative_feedback_penalty: -50.0
      negative_confidence_multiplier: 0.5
    archiver:
      archive_dir: "data/archived"
      compression: true
    garbage_collector:
      low_watermark: 20.0
      batch_size: 10

  artifacts:
    enabled: true
    root_dir: ".hivememory/artifacts"
    max_inline_summary_chars: 500

# ========== Workspace 运行时配置 ==========
workspace:
  # 会话只在进程内保存，容量用尽时显式拒绝新增。
  sessions:
    max_sessions_per_workspace: 128
    max_turns_per_session: 512
  # System 关闭时向在途任务进程发出停止，等待交付方自行收口的秒数；超时兜底关闭。
  process:
    shutdown_wait_seconds: 10
  # 读取能力派生缓存的全局 LRU 容量（不承诺 Workspace 独立配额）；
  # 当前性由失效事件协作保证，容量只影响命中率与内存占用。
  cache:
    atom_capacity: 4096
    profile_capacity: 256

# ========== Alice 子系统配置 ==========
alice:
  koakuma:
    enabled: true
    workspace_path: "./workspace"
    mtp_prompt:
      enabled: true
      include_demo: true
      include_error_handling: true

  runtime:
    max_loop_iterations: 10
    default_context_window: 65536  # 未登记模型窗口时使用的保守总窗口
    safety_margin: 2048           # 为字符估算误差预留的 token 数

  compaction:
    enabled: true
    target_ratio: 0.5
    summary_max_tokens: 1024
    summary_input_tool_chars: 2000
    summary_timeout_seconds: 60
    max_references: 16
    reference_max_chars: 256
    trigger_ratio: 0.75
    recent_raw_ratio: 0.25
    tool_result_excerpt_chars: 2000

# System 接入登记（调用来源）的模板
#
# 本文件随仓库发布，不在运行中修改。生效的登记是同目录的 system_principals.yaml，
# 它不受版本控制：后端启动时它不存在，就从本模板复制一份。设置页的“接入与权限”
# 只修改生效的登记，写回时不保留注释；指定了 HIVEMEMORY_PRINCIPALS_PATH 时使用
# 该路径的文件，不从模板生成。
#
# 本文件是两类访问登记之一（System 所有）：声明允许接入的调用来源及其
# 可用的 adapter。principal 配置不授予任何 Workspace operation——操作
# 许可只由 workspace_actors.yaml 表达。
#
# - allow_system_actor：能否声明保留的 system 进入 root API，默认 false；
# - allowed_agent_ids：该来源能声明哪些 Agent，省略表示不限定；
# - credential_env：接入凭据所在的环境变量名，凭据本身不写入登记。外部入口
#   （mcp、import）的 principal 取自请求声明，每次认证都以凭据证明：凭据来自
#   这个环境变量，或设置页生成、保存在同目录 principals.secrets.yaml 中的凭据，
#   环境变量有值时优先；两者都没有时照常启动并告警，该来源的认证一律被拒绝。
#   一条登记不能同时列出进程内 adapter（local、http）与外部 adapter。
#
# 拒绝未知字段。环境变量中的凭据修改后经重启生效。

principals:
  # HTTP 入口（server）作为 system actor 的 adapter 接入统一认证网关。
  # principal_id 需与 config.yaml 的 system.server_principal_id 一致。
  - principal_id: "hivememory:http-server"
    kind: "http-server"
    enabled: true
    adapters:
      - "http"
    allow_system_actor: true

  # 系统自身的来源：任务进程注册与 Import Bus 的导入、确定话题以它认证 (user, system)，
  # 由 system 执行系统阶段、取消与交互提交。缺少这条登记时 chat 注册与导入
  # 都以 unknown_principal 拒绝；自定义过本文件的部署需要补上。
  - principal_id: "hivememory:system"
    kind: "local-process"
    enabled: true
    adapters:
      - "local"
    allow_system_actor: true

  # Profile 注入脚本的独立本地来源；Workspace 管理仍需 system 准入与 root 授权。
  - principal_id: "hivememory:profile-injector"
    kind: "local-process"
    enabled: true
    adapters:
      - "local"
    allow_system_actor: true

  # Claude Code（插件中的连接器与 MCP server 共用）：经 import 导入已结束的
  # 交互，经 mcp 检索与读取记忆，两者都以同一凭据认证；只能声明 Agent claude_code，
  # 不能声明 system。
  - principal_id: "harness:claude-code"
    kind: "harness"
    enabled: true
    adapters:
      - "mcp"
      - "import"
    allowed_agent_ids:
      - "claude_code"
    credential_env: "HIVEMEMORY_CLAUDE_CODE_TOKEN"

  # DeepSeek Harness（dsh 插件中的回流与记忆工具共用）：经 import 导入已结束的
  # 交互，经 mcp 检索、读取、写入与更新记忆，两者都以同一凭据认证；不能声明 system。
  - principal_id: "harness:dsh"
    kind: "harness"
    enabled: true
    adapters:
      - "mcp"
      - "import"
    allowed_agent_ids:
      - "dsh"
    credential_env: "HIVEMEMORY_DSH_TOKEN"

  # Codex（插件中的连接器与 MCP server 共用）：经 import 导入已结束的交互，经 mcp
  # 检索、读取、写入与更新记忆，两者都以同一凭据认证；不能声明 system。
  - principal_id: "harness:codex"
    kind: "harness"
    enabled: true
    adapters:
      - "mcp"
      - "import"
    allowed_agent_ids:
      - "codex"
    credential_env: "HIVEMEMORY_CODEX_TOKEN"

  # pi（扩展中的回流与记忆工具共用）：经 import 导入已结束的交互，经 mcp 检索、
  # 读取、写入与更新记忆，两者都以同一凭据认证；不能声明 system。
  - principal_id: "harness:pi"
    kind: "harness"
    enabled: true
    adapters:
      - "mcp"
      - "import"
    allowed_agent_ids:
      - "pi"
    credential_env: "HIVEMEMORY_PI_TOKEN"

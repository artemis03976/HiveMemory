# Workspace Actor 访问登记（准入 + 行为白名单）
#
# 本文件是两类访问登记之一（workspace 所有）：一条记录同时承载准入状态
# 与行为白名单。W0 兼容基线：user_id 必须等于 owner_user_id；缺失记录即
# 准入失败（fail closed）。operation 使用行为目录的枚举值，允许为空。
#
# agent_id 省略表示用户级记录：覆盖该用户的所有具体 Agent，但不覆盖保留
# 的 system（system 必须单独显式登记）；每个 (owner, workspace, user) 至多
# 一条用户级记录。匹配时精确记录优先；精确记录被禁用即拒绝，不回落到
# 用户级记录。
#
# 登记修改经重启生效，不提供热更新。

workspace_actors:
  # 本地默认用户：覆盖 default 用户在 main_workspace 的所有具体 Agent。
  # 白名单只包含现有调用方实际需要的 operation。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    allowed_operations:
      - "resource.read"
      - "resource.search"
      - "profile.read"
      - "asset.acquire"
      - "interaction.submit"

  # 保留 system actor：管理入口（memories/topics/agents/assets/memory-tasks
  # 与 chat 取消）以 (user, system) 坐标经网关取得 context。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    agent_id: "system"
    allowed_operations:
      - "management.memory"
      - "management.topic"
      - "management.asset"
      - "management.task"
      - "resource.read"
      - "task.observe"

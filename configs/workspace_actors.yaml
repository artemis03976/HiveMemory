# Workspace Actor 访问登记（准入 + 行为白名单）
#
# 本文件是两类访问登记之一（workspace 所有）：一条记录同时承载准入状态
# 与行为白名单。W0 兼容基线：user_id 必须等于 owner_user_id；缺失记录即
# 准入失败（fail closed）。operation 只接受六项 actor 操作的枚举值，允许为空；
# root 管理与任务进程的阶段调用不经白名单。
#
# agent_id 省略表示用户级记录：覆盖该用户的所有具体 Agent，但不覆盖保留
# 的 system（system 必须单独显式登记）；每个 (owner, workspace, user) 至多
# 一条用户级记录。匹配时精确记录优先；精确记录被禁用即拒绝，不回落到
# 用户级记录。
#
# 登记修改经重启生效，不提供热更新。

workspace_actors:
  # 本地默认用户：覆盖 default 用户在 main_workspace 的所有具体 Agent。
  # 白名单包含全部六项 actor 操作，与 MTP 的 READ/SEARCH/RUN/WRITE/UPDATE/CALL 对应。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    allowed_operations:
      - "memory.read"
      - "memory.search"
      - "memory.run"
      - "memory.write"
      - "memory.update"
      - "agent.call"

  # 保留 system actor：HTTP 管理入口与 chat 取消经网关取得 context。
  # root API 只检查准入、目标与 system 身份，不使用 actor 操作白名单；
  # system 记录不得配置 operation。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    agent_id: "system"

  # Claude Code 连接器（Import Bus）：以 (default, claude_code) 声明导入已结束
  # 的交互。导入只校验准入与目标、不经白名单；精确记录优先于上方的用户级
  # 记录，空白名单使这个 Agent 只能准入，不继承六项 actor 操作。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    agent_id: "claude_code"
    allowed_operations: []

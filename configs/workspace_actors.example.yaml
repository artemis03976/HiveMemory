# Workspace Actor 访问登记（准入 + 行为白名单）的模板
#
# 本文件随仓库发布，不在运行中修改。生效的登记是同目录的 workspace_actors.yaml，
# 它不受版本控制：后端启动时它不存在，就从本模板复制一份。设置页的“接入与权限”
# 只修改生效的登记，写回时不保留注释；指定了 HIVEMEMORY_WORKSPACE_ACTORS_PATH 时
# 使用该路径的文件，不从模板生成。
#
# 外部 harness 的 Agent 没有预先登记：插件页安装插件时，为插件的缺省 Agent 补一条
# 只开放检索、读取、写入与更新的记录（已有记录时不改动）；卸载插件不删除它。
#
# 本文件是两类访问登记之一（workspace 所有）：一条记录同时承载准入状态
# 与行为白名单。W0 兼容基线：user_id 必须等于 owner_user_id；缺失记录即
# 准入失败（fail closed）。operation 只接受六项 actor 操作的枚举值，允许为空；
# root 管理与任务进程的阶段调用不经白名单。
#
# agent_id 省略表示用户级记录：覆盖该用户的所有具体 Agent，但不覆盖保留
# 的 system（system 必须单独显式登记）；每个 (owner, workspace, user) 至多
# 一条用户级记录。匹配时精确记录优先；精确记录被禁用即拒绝，不回落到
# 用户级记录。

workspace_actors:
  # 本地默认用户：覆盖 default 用户在 main_workspace 的所有具体 Agent。
  # 白名单包含全部六项 actor 操作，与 MTP 的 READ/SEARCH/RUN/WRITE/UPDATE/CALL 对应。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    allowed_operations:
      - "memory.read"
      - "memory.search"
      - "memory.run"
      - "memory.write"
      - "memory.update"
      - "agent.call"

  # 保留 system actor：HTTP 管理入口与 chat 取消，以及任务进程的系统阶段与
  # Import Bus 的确定话题和交互提交，都以它执行系统级操作。root 授权只检查准入、
  # 目标与 system 身份，不使用 actor 操作白名单；system 记录不得配置 operation。
  - owner_user_id: "default"
    workspace_id: "main_workspace"
    user_id: "default"
    agent_id: "system"

# HiveMemory 提供商凭证示例文件
# ============================================================
# 将此文件复制为 providers.secrets.yaml 并填入真实密钥。
# providers.secrets.yaml 已加入 .gitignore，不会被提交到版本控制。
#
# 字段说明：
#   api_key  - 提供商 API 密钥（必填，用于认证）
#   api_base - 自定义 API 地址（可选，留空使用提供商默认值）
#
# Provider 名称（如 "deepseek"、"openai"）需与 models.yaml 中
# 模型的 provider 字段保持一致（大小写不敏感）。
#
# 优先级：环境变量 HIVEMEMORY__PROVIDERS__<NAME>__API_KEY
#         高于此文件（适合 CI/CD 注入覆盖）
# ============================================================

providers:
  deepseek:
    api_key: "sk-your-deepseek-api-key-here"
    api_base: "https://api.deepseek.com"

  openai:
    api_key: "sk-your-openai-api-key-here"
    api_base: null   # 留空使用官方默认地址

  # 添加更多提供商（名称任意，与 models.yaml 的 provider 字段对应即可）
  # anthropic:
  #   api_key: "sk-ant-your-key-here"
  #   api_base: null
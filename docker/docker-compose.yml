services:
  # HiveMemory 后端应用服务 (包含前端静态资源)
  hivememory-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hivememory_app
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - HIVEMEMORY_SERVE_FRONTEND=true
      # Docker 内通过服务名连接 Qdrant
      - HIVEMEMORY__PATCHOULI__STORAGE__HOST=qdrant
      - HIVEMEMORY__PATCHOULI__STORAGE__PORT=6333
      - HIVEMEMORY__PATCHOULI__STORAGE__GRPC_PORT=6334
      - HIVEMEMORY__PATCHOULI__STORAGE__PREFER_GRPC=true
      # 指定配置文件路径（挂载到容器内）
      - HIVEMEMORY_CONFIG_PATH=/app/configs/config.yaml
    volumes:
      # 挂载配置目录以持久化用户配置
      - ../configs:/app/configs
      # 可选：如果需要在本地查看或保留日志
      - ../logs:/app/logs
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - hivememory_network

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: hivememory_qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - hivememory_network

  # Qdrant Web UI (可选 - 用于可视化调试)
  qdrant-web-ui:
    image: qdrant/qdrant-web-ui:v1.16.3
    container_name: hivememory_qdrant_ui
    ports:
      - "6335:80"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - hivememory_network
    profiles:
      - debug  # 仅在 debug 模式下启动: docker-compose --profile debug up -d

volumes:
  qdrant_storage:
    driver: local

networks:
  hivememory_network:
    driver: bridge

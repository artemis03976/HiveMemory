[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivememory"
version = "0.1.0-beta"
description = "蜂巢记忆系统 - 专为 LLM Agent 设计的持久化记忆与知识共享基础设施"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "artemis03976"}
]
keywords = ["llm", "agent", "memory", "rag", "vector-database", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache License 2.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "litellm>=1.30.0",
    "qdrant-client>=1.7.0",
    "fastembed>=0.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "httpx>=0.26.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "ipython>=8.20.0",
]
ui = [
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "pandas>=2.2.0",
]
search = [
    "duckduckgo-search>=7.0.0",
]

[project.scripts]
hivememory-server = "hivememory.server.__main__:main"

[project.urls]
Homepage = "https://github.com/artemis03976/HiveMemory"
Documentation = "https://github.com/artemis03976/HiveMemory/docs"
Repository = "https://github.com/artemis03976/HiveMemory"
Issues = "https://github.com/artemis03976/HiveMemory/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v -m 'not live_llm and not e2e and not slow'"
markers = [
    "unit: 快速单元测试，无外部依赖 (< 1s)",
    "integration: 多组件协作测试，使用 mock (< 10s)",
    "e2e: 端到端测试，需要真实外部服务 (Qdrant, Embedding, Reranker)",
    "live_llm: 需要真实 LLM API (设置 LLM 相关环境变量或 config.yaml)",
    "slow: 耗时 > 30s 的测试 (idle timeout 等)",
]

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src file:" />
    <title>HiveMemory</title>
    <style>
      /* 打包时字体随程序复制到 fonts/；从源码目录运行时取前端依赖中的同一个文件 */
      @font-face {
        font-family: 'Manrope';
        font-weight: 200 800;
        src:
          url('fonts/manrope-latin-wght-normal.woff2') format('woff2'),
          url('../../frontend/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2');
      }
      /* 配色与前端的深浅两套令牌一致，随系统的深浅色设置切换 */
      :root {
        color-scheme: dark;
        --bg: #0e0c15;
        --fg: #efebf8;
        --fg-3: #8d86a3;
        --line: rgb(226 214 255 / 0.08);
        --brand: linear-gradient(135deg, #9d6bff 0%, #d27ff0 55%, #ff9cc6 100%);
        --glow: 0 0 18px rgb(157 107 255 / 0.45);
        --atmo:
          radial-gradient(900px 520px at 100% -10%, rgb(255 156 198 / 0.07), transparent 70%),
          radial-gradient(900px 600px at -5% 105%, rgb(157 107 255 / 0.1), transparent 70%);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f6f3fc;
          --fg: #1e1930;
          --fg-3: #6f6888;
          --line: #e6e0f2;
          --brand: linear-gradient(135deg, #6e3fdc 0%, #a94fd0 55%, #e2609f 100%);
          --glow: 0 4px 14px rgb(110 63 220 / 0.25);
          --atmo:
            radial-gradient(900px 520px at 100% -10%, rgb(226 96 159 / 0.07), transparent 70%),
            radial-gradient(900px 600px at -5% 105%, rgb(110 63 220 / 0.07), transparent 70%);
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--atmo), var(--bg);
        color: var(--fg);
        font-family: 'Microsoft YaHei UI', system-ui, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .mark {
        display: flex;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: var(--brand);
        box-shadow: var(--glow);
      }
      h1 {
        margin: 6px 0 0;
        font-family: 'Manrope', 'Microsoft YaHei UI', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: var(--fg-3);
      }
      .bar {
        position: relative;
        width: 160px;
        height: 3px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--line);
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: var(--brand);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          width: 100%;
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z" />
          <path d="M12 7.5l1.3 3.2 3.2 1.3-3.2 1.3L12 16.5l-1.3-3.2L7.5 12l3.2-1.3z" />
        </svg>
      </div>
      <h1>HiveMemory</h1>
      <p id="status" role="status">正在启动 Qdrant 与后端</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>

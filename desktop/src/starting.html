<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>HiveMemory</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f5f0;
        --fg: #2b2a27;
        --muted: #77736b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b19;
          --fg: #ece9e2;
          --muted: #a19c92;
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, 'Microsoft YaHei UI', sans-serif;
      }
      p {
        margin: 0.4em 0;
        text-align: center;
      }
      .hint {
        color: var(--muted);
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div>
      <p>正在启动 HiveMemory…</p>
      <p id="status" class="hint">正在启动 Qdrant 与后端</p>
    </div>
  </body>
</html>

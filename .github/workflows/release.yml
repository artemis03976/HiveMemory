name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (example: v0.6.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_backend:
    name: Build Backend Package
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release version
        run: python scripts/check_version_consistency.py --tag "$TAG_NAME"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > backend-checksums.txt

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/backend-checksums.txt
          if-no-files-found: error

  build_frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Archive frontend dist
        run: |
          tar -czf frontend-dist-${TAG_NAME}.tar.gz -C frontend dist
          sha256sum frontend-dist-${TAG_NAME}.tar.gz > frontend-checksums.txt

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend-dist-*.tar.gz
            frontend-checksums.txt
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build_backend
      - build_frontend
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: release-assets/backend

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release-assets/frontend

      - name: Merge checksums
        run: |
          (cd release-assets/backend && sha256sum --check backend-checksums.txt)
          (cd release-assets/frontend && sha256sum --check frontend-checksums.txt)
          cat release-assets/backend/backend-checksums.txt release-assets/frontend/frontend-checksums.txt > release-assets/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG_NAME, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/backend/*.whl
            release-assets/backend/*.tar.gz
            release-assets/frontend/*.tar.gz
            release-assets/SHA256SUMS.txt
